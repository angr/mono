name: Nix with the shared store
description: >
  Install Nix and put this revision's prebuilt store closure in front of it, so
  a job that needs angr does not build angr.

inputs:
  token:
    description: Token used to read the cache release.
    required: true

outputs:
  cache-key:
    description: The store-cache key for this revision.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # Two statements, not one: `echo "key=$(cmd)"` reports echo's status, so a
    # failed key would come out empty and every job would quietly rebuild.
    - id: key
      shell: bash
      run: |
        key=$(ci/nix-cache.sh key)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # The warm closure (angr, Qt, 450 MB of fixtures, 200 MB of angr-data)
    # arrives compressed, is unpacked, and is then substituted into the store:
    # three copies at the peak, against a runner image that leaves ~20 GB free.
    # The Android SDK and .NET alone are most of what is in the way.
    - name: Make room for the store
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/share/boost /usr/share/swift
        df -h /

    # `.nix-cache` is written by the restore step below and by nothing else.
    # A copy committed on a branch would already be on disk at this point,
    # and the installer is about to trust that directory as a substituter
    # with signature checking off -- so a branch could hand every job store
    # paths it did not build, under a key whose inputs it did not change.
    # Refuse it rather than configure around it.
    - name: Refuse a checked-in store cache
      shell: bash
      run: |
        if [[ -e .nix-cache ]]; then
            echo "::error::.nix-cache is present in the checkout." >&2
            echo "It is created by CI from the release asset, never committed." >&2
            exit 1
        fi

    # SHA-pinned, as upstream angr pins its actions. This one installs
    # the Nix that `warm` builds the whole closure with, and warm gates
    # every other job -- a patch release changing the default Nix
    # version would break the entire matrix on a day nothing changed.
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        # The cache is an ordinary file:// binary cache, so a job substitutes
        # only the paths it actually asks for instead of importing 4 GB to run
        # a two-minute suite. It is unsigned, and it is a directory this
        # workflow just wrote, so signature checking has nothing to check.
        extra-conf: |
          extra-substituters = file://${{ github.workspace }}/.nix-cache
          extra-trusted-substituters = file://${{ github.workspace }}/.nix-cache
          require-sigs = false
          max-jobs = auto
          cores = 0

    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: .nix-cache
        key: nix-store-${{ steps.key.outputs.key }}

    - name: Fall back to the release copy
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: ci/nix-cache.sh pull "${{ steps.key.outputs.key }}"
