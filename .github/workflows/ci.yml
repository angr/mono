name: CI

# One build, then everything in parallel.
#
# `warm` builds the whole closure once and publishes it as a Nix binary cache
# (an actions/cache entry, with a GitHub release asset behind it for when that
# entry is evicted). Every other job substitutes from it, so the test matrix
# starts running suites within a minute of starting instead of each of its
# jobs compiling angr's Rust extension for itself.

on:
  push:
    branches: [main]
  pull_request:
  # As angr's own ci.yml has it. Without this a merge queue would run no
  # checks at all on the thing it is about to merge.
  merge_group:
  workflow_dispatch:

# bash everywhere, as upstream's own release workflow sets it. The Windows
# runner defaults to PowerShell, where `$SUITES` is an undefined PowerShell
# variable rather than the environment variable the step set -- so every
# Windows native job ran `python ci/run-native.py` with no suites at all,
# produced no junit XML, and passed. `if-no-files-found: error` on the
# results upload is what finally made it say so.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not on main, as upstream guards it too. A superseded pull-request run is
  # wasted work; a superseded main run may be halfway through uploading the
  # store cache, and an upload killed there leaves the asset in state
  # "starter" -- listed, and a 404 for every job that asks for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Only the job that publishes the store cache needs to write; the matrix jobs
# run third-party test code and get a read-only token.
permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      native: ${{ steps.matrix.outputs.native }}
      coverage: ${{ steps.matrix.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
      # Two statements, not one: `echo "x=$(cmd)"` reports echo's exit status,
      # so a matrix.py that raised would leave this step green and an empty
      # matrix for `fromJSON` to choke on later.
      - id: matrix
        run: |
          matrix=$(ci/matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          native=$(ci/matrix.py --native)
          echo "native=$native" >> "$GITHUB_OUTPUT"
          coverage=$(ci/matrix.py --coverage)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  warm:
    name: Warm the store
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # This job imports angr and angrmanagement below -- component code from
      # the tree under test, outside the Nix sandbox -- and it is the one job
      # holding a release-writable token. The publish step takes that token
      # through GH_TOKEN, so it does not also need to be sitting in
      # .git/config while that import runs.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: nix
        uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}

      - name: Build everything
        run: |
          nix build --no-link --print-build-logs \
            .#test-env .#gui-env .#binaries .#angr .#angr-management-lib

      # The test jobs enter these shells, so the warm-up enters them too: it
      # proves the exact derivations they will ask for are the ones now in the
      # cache, rather than something that merely contains them.
      - name: Enter the shells the test jobs use
        run: |
          nix develop .#test --command python3 -c 'import angr, pydantic_ai, fastmcp'
          nix develop .#gui --command python3 -c 'import angrmanagement'
          # pysoot and tracer need more than an import: both reach outside the
          # Python environment -- pysoot starts a JVM through jpype, tracer
          # runs a 32-bit ELF under qemu -- on JAVA_HOME and QEMU_LD_PREFIX
          # from the test shell. Importing them proves nothing about either.
          # Losing JAVA_HOME surfaces as fifty JVMNotFoundException tracebacks
          # in two unrelated-looking files; losing QEMU_LD_PREFIX is worse,
          # because tracer does not fail, it hangs in the solver until the
          # per-test timeout. Prove both here, where the message can name the
          # cause.
          nix develop .#test --command python3 -c '
          import os, subprocess, sys
          import shellphish_qemu
          from pysoot.lifter import _get_java_home

          java = _get_java_home()
          print("java home:", java)

          prefix = os.environ.get("QEMU_LD_PREFIX", "")
          loader = os.path.join(prefix, "lib", "ld-linux.so.2")
          if not os.path.exists(loader):
              sys.exit(f"no 32-bit loader at {loader!r}; tracer would hang")
          print("qemu loader:", loader)
          ' 

      # A no-op when this revision's asset already exists, and skipped
      # entirely for a fork's pull request, whose token cannot write releases.
      - name: Publish the store cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Publishing is an optimisation for the jobs downstream. A release
        # API hiccup here would otherwise fail `warm`, and `warm` failing
        # skips `checks` and every one of the test jobs.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/nix-cache.sh push "${{ steps.nix.outputs.cache-key }}"

      # Saving an empty cache would be worse than saving none: actions/cache
      # refuses to overwrite a key, so the stub would stick until the tree
      # changed, and every job would restore it, skip the release fallback,
      # and rebuild angr from source.
      - id: worth-saving
        if: always()
        run: |
          if compgen -G '.nix-cache/*.narinfo' > /dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v6
        if: always() && steps.worth-saving.outputs.ok == '1'
        with:
          path: |
            .nix-cache
            ~/.cache/nix
          key: nix-store-${{ steps.nix.outputs.cache-key }}

  checks:
    name: Flake checks
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}
      # Two steps, because they answer different questions: whether every
      # output evaluates on every system this flake offers it for, and whether
      # this system's checks pass. See ci/check-eval.sh for why the obvious
      # `nix flake check --all-systems` is neither.
      - run: ci/check-eval.sh
      - run: nix flake check --print-build-logs

  test:
    name: ${{ matrix.label }}
    needs: [plan, warm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}

      - name: Run ${{ matrix.label }}
        env:
          SUITES: ${{ matrix.suites }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: ci/run-job.sh "$SUITES" --shard "$SHARD" --of "$SHARDS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          # The log as well as the XML. The XML says a test failed; the log
          # says why, and it is the only place the deselect announcement and
          # the skip reasons appear.
          path: |
            test-results/*.xml
            test-results/*.log
          # A pytest that dies during collection writes no XML. With `ignore`
          # the lane contributes no row to the summary table and nothing
          # anywhere says a suite went missing.
          if-no-files-found: error

  # The second lane. Nix does not run on Windows, and upstream gates on
  # Windows, macOS and Python versions past 3.12 -- so those get the same
  # suites through uv, against the same component sources and, because both
  # lanes read flake.lock, the same external commits.
  native:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      # As upstream pysoot's own test job does. jpype finds the JVM through
      # JAVA_HOME, which this action sets; the Nix lane gets the same thing
      # from pkgs.jdk in the test shell.
      - uses: actions/setup-java@v5
        if: contains(matrix.components, 'pysoot')
        with:
          distribution: zulu
          java-version: "21"
      # angr's rustylib and pyvex's libvex are compiled here, not substituted.
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Git ships its own link.exe in usr/bin, and bash -- now the default
      # shell everywhere -- puts that directory on PATH ahead of the MSVC
      # tools, so cargo's build scripts link with the wrong one and every
      # Rust crate fails. Upstream's release workflow deletes it for the
      # same reason.
      - name: Unshadow the MSVC linker
        if: runner.os == 'Windows'
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"
      - name: Qt and X11 for angr-management
        if: runner.os == 'Linux' && contains(matrix.suites, 'angr-management')
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
      - name: Keystone and flatbuffers for angr-management
        if: runner.os == 'macOS' && contains(matrix.suites, 'angr-management')
        run: brew install flatcc flatbuffers keystone

      - name: Install the workspace
        env:
          PYVER: ${{ matrix.python }}
          COMPONENTS: ${{ matrix.components }}
        run: python ci/run-native.py --install --python "$PYVER" --for "$COMPONENTS"

      - name: Run ${{ matrix.label }}
        if: matrix.suites != ''
        env:
          SUITES: ${{ matrix.suites }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        # Word splitting is the point: SUITES is a space-separated list.
        run: |
          # shellcheck disable=SC2086
          python ci/run-native.py $SUITES --shard "$SHARD" --of "$SHARDS"

      # Upstream's `installation` job, verbatim in effect: collect the suite
      # without running it. That imports every test module and every symbol
      # they pull out of angr, which is what catches a refactor that does not
      # survive the platform. Running the suite itself is the Nix lane's job.
      - name: Collect ${{ matrix.collect }}
        if: matrix.collect != ''
        env:
          COLLECT: ${{ matrix.collect }}
        run: |
          # shellcheck disable=SC2086
          python ci/run-native.py $COLLECT --collect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          # The log as well as the XML. The XML says a test failed; the log
          # says why, and it is the only place the deselect announcement and
          # the skip reasons appear.
          path: |
            test-results/*.xml
            test-results/*.log
          # A pytest that dies during collection writes no XML. With `ignore`
          # the lane contributes no row to the summary table and nothing
          # anywhere says a suite went missing.
          if-no-files-found: error

  # Coverage, in the shape of upstream's coverage.yml: Python, C and Rust
  # measured from one instrumented build, because three builds cannot be
  # combined. It lives in the native lane and not the Nix one for the same
  # reason -- CFLAGS and RUSTFLAGS apply when the runner compiles, and Nix
  # would need a whole second instrumented closure to say the same thing.
  #
  # No Codecov: this repository has no project and no token, so the summary
  # job does the merging and rendering that Codecov would have done, and
  # ci/coverage.json is the ratchet that makes it a gate rather than an
  # artifact nobody reads.
  coverage:
    name: coverage · ${{ matrix.label }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.coverage) }}
    env:
      # As upstream's coverage.yml sets them. `%p-%m` keeps one profile per
      # process, which matters because the suites run forked.
      RUSTFLAGS: "-C instrument-coverage -C codegen-units=1"
      CFLAGS: "--coverage -O0 -g"
      LDFLAGS: "--coverage"
      COVERAGE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-java@v5
        if: contains(matrix.components, 'pysoot')
        with:
          distribution: zulu
          java-version: "21"
      - name: Qt and X11 for angr-management
        if: contains(matrix.components, 'angr-management')
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
      - name: Profile output path
        run: echo "LLVM_PROFILE_FILE=$PWD/test-results/%p-%m.profraw" >> "$GITHUB_ENV"
      - name: Install instrumented
        env:
          COMPONENTS: ${{ matrix.components }}
        run: python ci/run-native.py --install --python 3.12 --coverage --for "$COMPONENTS"
      - name: Measure ${{ matrix.label }}
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python ci/run-native.py "$SUITE" --coverage \
            --shard "$SHARD" --of "$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.id }}
          include-hidden-files: true
          path: |
            test-results/.coverage.*
            test-results/*.profraw
            test-results/*.xml
            test-results/*.log
          if-no-files-found: error

  # angr's Rust extension. The Nix lane compiles it; nothing there runs its
  # tests or looks at it the way upstream's rust_check/rust_test jobs do.
  rust:
    name: rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # angr/rust-toolchain.toml pins the toolchain, so rustup switches to it
      # inside angr/ and the components have to be added there rather than to
      # whatever the action installed as stable.
      - run: rustup component add rustfmt clippy
        working-directory: angr
      - run: cargo fmt --all -- --check
        working-directory: angr
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: angr
        if: runner.os == 'Linux'
      - run: cargo test --release
        working-directory: angr

  # The two ratchets upstream gates on. Neither demands a clean score; both
  # demand that a file you touched did not get worse. See the scripts.
  ratchets:
    name: Lint and typecheck ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the workspace
        run: python ci/run-native.py --install --python 3.12
      # A uv-created venv has no pip in it, so uv installs into it too.
      - run: uv pip install --python .venv-native/bin/python "pylint>=2.14.0" pyright
      # Through the environment, not interpolated into the command: git
      # permits `;`, `$` and backticks in a branch name, so a base branch can
      # otherwise choose what this step runs.
      - name: pylint score ratchet
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: .venv-native/bin/python ci/lint.py --base "origin/$BASE"
      - name: pyright badness ratchet
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          PATH="$PWD/.venv-native/bin:$PATH" .venv-native/bin/python ci/typecheck.py \
            --base "origin/$BASE"

  # Every component ships a .pre-commit-config.yaml, three of the commits
  # this tree imported are literally "[pre-commit.ci] pre-commit autoupdate",
  # and nothing here ran any of it. It is the ecosystem's only gate on
  # formatting, import order, modernisation, RST, symlinks and stray large
  # files -- pylint checks none of that. One job per component, because the
  # configs differ and a component's hooks are its own.
  pre-commit:
    name: pre-commit · ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - angr
          - angr-management
          - archinfo
          - claripy
          - cle
          - pypcode
          - pyvex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install pre-commit
      - name: Run ${{ matrix.component }}'s own hooks
        run: ci/pre-commit.sh ${{ matrix.component }}

  # pypcode is the one component upstream keeps out of the ecosystem sweep:
  # it ships wheels across five platforms and tests them with unittest, not
  # pytest. This is that job, for the platforms actions can reach.
  wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From an unpacked sdist, as upstream does, not from the tree.
      #
      # Two reasons, and the second one bit. It proves the sdist is complete
      # -- the thing a tree build can never tell you. And cibuildwheel reuses
      # one CMake build directory across Python versions, so a tree build
      # leaves cp312's CMakeCache behind and cp313 configures against the
      # wrong interpreter and dies.
      - name: Build the sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist pypcode
      - name: Unpack it
        # bash, because the default shell on the Windows runner is PowerShell
        # and PowerShell does not expand a glob for an external command:
        # tar.exe is handed the literal `dist/*.tar.gz` and cannot open it.
        shell: bash
        run: |
          mkdir sdist
          tar --strip-components 1 -xf dist/*.tar.gz -C sdist

      - uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: sdist
        env:
          CIBW_BUILD: cp312-* cp313-* cp314-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*musllinux*"
          # As upstream pypcode sets it, per architecture. Without it,
          # delocate refuses the x86_64 wheel -- `Library dependencies do not
          # satisfy target MacOS version 10.13` -- because the SDK's default
          # is older than what the C++ the SLEIGH decompiler needs was built
          # against. Ignored off macOS.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-15' && '11' || '10.14' }}
          CIBW_TEST_COMMAND: python -m unittest discover -v -s {package}/tests
          CIBW_BUILD_VERBOSITY: 1
          # cibuildwheel keeps one build directory per package and reuses it
          # for every Python, so cp312's CMakeCache is still sitting there
          # when cp313 configures: cmake reports `found version "3.12.13"`
          # and fails on the include dirs that go with an interpreter it is
          # not building for. Unpacking the sdist did not fix this -- the
          # sdist is unpacked once and built from three times.
          CIBW_BEFORE_BUILD: >-
            python -c "import shutil, sys;
            shutil.rmtree(sys.argv[1] + '/build', ignore_errors=True)"
            {package}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pypcode-${{ matrix.os }}
          path: wheelhouse/*.whl

  # angr-management's frozen app. Upstream calls pyinstaller-build.yml from
  # its own ci.yml, so this gates on every pull request there: it catches an
  # import PyInstaller's analysis cannot see, a resource missing from the
  # spec's datas, an unbundled Qt platform plugin -- none of which the test
  # suite can observe, because the suite runs in a venv where everything is
  # importable by construction.
  pyinstaller:
    name: pyinstaller · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The five upstream's pyinstaller-build.yml freezes on. Three of
        # them were here, which left ARM64 Linux -- and the older Ubuntu
        # upstream uses as its AppImage baseline -- never built at all.
        os:
          [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Git ships its own link.exe in usr/bin, and bash -- now the default
      # shell everywhere -- puts that directory on PATH ahead of the MSVC
      # tools, so cargo's build scripts link with the wrong one and every
      # Rust crate fails. Upstream's release workflow deletes it for the
      # same reason.
      - name: Unshadow the MSVC linker
        if: runner.os == 'Windows'
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"
      - name: Qt and X11
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 xvfb x11-utils
      - name: Keystone and flatbuffers
        if: runner.os == 'macOS'
        run: brew install flatcc flatbuffers keystone
      - run: python ci/run-native.py --install --python 3.12
      # From the script that made the environment, because only it knows
      # that Windows puts the interpreter in Scripts/ and that bash's own
      # $PWD there is an MSYS path -- `/d/a/mono/mono`, which uv rejects with
      # "failed to inspect Python interpreter". This is the native path.
      - name: Locate the environment
        run: echo "VENV_PY=$(python ci/run-native.py --print-python)" >> "$GITHUB_ENV"
      # angr-management's `pyinstaller` dependency group, which upstream gets
      # from `uv sync` and this lane installs by hand, minus its
      # `angr[unicorn]` entry that ci/run-native.py already built from the
      # tree. Both markers are load-bearing rather than decoration: pillow is
      # what converts the spec's .ico to the .icns macOS insists on, and
      # without it the freeze dies on the icon; keystone has no aarch64 Linux
      # wheel.
      - run: uv pip install --python "$VENV_PY" "pyinstaller~=6.19"
      - if: runner.os == 'macOS'
        run: uv pip install --python "$VENV_PY" pillow
      - if: runner.os != 'Linux' || runner.arch != 'ARM64'
        run: uv pip install --python "$VENV_PY" keystone-engine
      # ci/import.py drops these two submodules -- 195 MB of FLIRT
      # signatures and 7 MB of library docs, runtime data rather than code
      # under test -- but the spec names both in its `datas` and PyInstaller
      # refuses a path that is not there. Upstream gets them from
      # `submodules: recursive` on its checkout; cloning them at freeze time
      # keeps the bundle equal to upstream's without the tree carrying 200 MB.
      - name: Resource submodules
        working-directory: angr-management/angrmanagement/resources
        # Pinned and retried. Unpinned, the frozen bundle's contents changed
        # whenever either repository's default branch moved, so a build that
        # passed on Monday was not the build that runs on Thursday; unretried,
        # a slow GitHub failed the lane outright.
        env:
          FLIRT: eaf9234448ced5800497d8ec2c565b186c9f65e4
          DOCS: d3ed48c58a871d7d2fdc8ea560209afb8718d72e
        run: |
          clone() {
              for attempt in 1 2 3; do
                  git clone --filter=blob:none "https://github.com/angr/$1" "$1" &&
                      git -C "$1" checkout --detach --quiet "$2" && return 0
                  echo "clone of $1 failed (attempt $attempt); retrying" >&2
                  rm -rf -- "$1"
                  sleep $((attempt * 10))
              done
              return 1
          }
          clone flirt_signatures "$FLIRT"
          clone library_docs "$DOCS"
      # `-m PyInstaller`, not the console script: resolving
      # `Scripts/pyinstaller` by hand is the same platform guess again.
      - name: Freeze
        working-directory: angr-management
        run: |
          "$VENV_PY" -m PyInstaller angr-management.spec
      # Upstream's test_ubuntu: start the thing and look for its window.
      - name: Start it
        if: runner.os == 'Linux'
        working-directory: angr-management
        run: |
          xvfb-run bash -c '
            ./dist/angr-management/angr-management &
            sleep 45
            xwininfo -tree -root | grep -i "angr management"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: angr-management-${{ matrix.os }}
          path: angr-management/dist
          if-no-files-found: error

  # pyvex gates on a Pyodide build upstream, and cle is pinned here at the
  # commit titled "Test CLE under Pyodide (#704)" -- the emscripten markers in
  # its pyproject and the sys.platform guards in its tests are otherwise dead
  # weight in this tree.
  #
  # Only pyvex for now. cle's pyodide job runs its suite inside a
  # `uv sync --python pyodide@3.14` environment against the pyvex wheel built
  # here, which is a second thing to get right and is not done yet.
  pyodide:
    name: pyodide · pyvex
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the pinned VEX sources
        run: python ci/fetch-external.py vex
      - uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: pyvex
        env:
          CIBW_PLATFORM: pyodide
          CIBW_PYODIDE_VERSION: "314.0.0"
          # pyvex's own config says `pytest {project}/tests`, and {project} is
          # the repository root -- which upstream is pyvex and here is not.
          CIBW_TEST_COMMAND: pytest {package}/tests
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-pyvex
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Sphinx. Every component reports a readthedocs status on its pull
  # requests, and pypcode builds its docs inside Actions on top of that.
  # autodoc imports the package to document it, so this also catches a
  # docstring that crashes sphinx-autodoc-typehints and a broken
  # cross-reference -- neither of which any test suite touches.
  docs:
    name: docs · ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [angr, angr-management, archinfo, claripy, cle, pypcode, pyvex]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Qt for angr-management's autodoc
        if: matrix.component == 'angr-management'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
      - run: python ci/run-native.py --install --python 3.12
      - name: Documentation tooling
        run: |
          uv pip install --python .venv-native/bin/python \
            furo myst-parser sphinx sphinx-autodoc-typehints ipython
      - name: Build ${{ matrix.component }}'s docs
        working-directory: ${{ matrix.component }}/docs
        env:
          QT_QPA_PLATFORM: offscreen
        run: ../../.venv-native/bin/python -m sphinx -b html . _build/html

  summary:
    name: Summary
    # plan and warm included, and 'skipped' gated alongside 'failure'. A
    # `needs:` is an implicit `if: success()`, so when warm dies its
    # dependents report `skipped`, not `failure` -- and with neither job in
    # this list, a warm failure left Summary green with the entire Nix lane
    # never having run. No job here is conditional, so a skip always means
    # something upstream of it broke.
    needs:
      [
        plan,
        warm,
        test,
        native,
        coverage,
        rust,
        ratchets,
        wheels,
        checks,
        pre-commit,
        pyinstaller,
        pyodide,
        docs,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: results-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: coverage-*
          merge-multiple: true
      # The baseline check writes to the step summary as well, so a run that
      # fails on it says which suite and by how much where the reader is
      # already looking.
      - run: |
          ci/summarize.py test-results --baseline ci/skips.json \
            >> "$GITHUB_STEP_SUMMARY"

      # What Codecov would have done: merge the shards, render the result,
      # and hold it to a floor. llvm-tools for the Rust half, gcovr for the C
      # half; both come from the same instrumented build the coverage lane
      # made.
      - name: Coverage tooling
        run: |
          python -m pip install --quiet "coverage[toml]" gcovr
          sudo apt-get update
          sudo apt-get install -y llvm
      - name: Coverage report
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          ci/coverage-report.py test-results --baseline ci/coverage.json \
            >> "$GITHUB_STEP_SUMMARY"
      # `needs.*` over the whole dependency list rather than a hand-written
      # enumeration: the enumeration named six of the ten lanes, so
      # pre-commit, pyinstaller, pyodide and docs could each go red with this
      # job green. A gate you have to remember to extend is a gate that
      # eventually lies about a lane nobody is looking at.
      - name: Fail if any lane failed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
