name: CI

# One build, then everything in parallel.
#
# `warm` builds the whole closure once and publishes it as a Nix binary cache
# (an actions/cache entry, with a GitHub release asset behind it for when that
# entry is evicted). Every other job substitutes from it, so the test matrix
# starts running suites within a minute of starting instead of each of its
# jobs compiling angr's Rust extension for itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only the job that publishes the store cache needs to write; the matrix jobs
# run third-party test code and get a read-only token.
permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      # Two statements, not one: `echo "x=$(cmd)"` reports echo's exit status,
      # so a matrix.py that raised would leave this step green and an empty
      # matrix for `fromJSON` to choke on later.
      - id: matrix
        run: |
          matrix=$(ci/matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          native=$(ci/matrix.py --native)
          echo "native=$native" >> "$GITHUB_OUTPUT"

  warm:
    name: Warm the store
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: nix
        uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}

      - name: Build everything
        run: |
          nix build --no-link --print-build-logs \
            .#test-env .#gui-env .#binaries .#angr .#angr-management-lib

      # The test jobs enter these shells, so the warm-up enters them too: it
      # proves the exact derivations they will ask for are the ones now in the
      # cache, rather than something that merely contains them.
      - name: Enter the shells the test jobs use
        run: |
          nix develop .#test --command python3 -c 'import angr, pydantic_ai, fastmcp'
          nix develop .#gui --command python3 -c 'import angrmanagement' 

      # A no-op when this revision's asset already exists, and skipped
      # entirely for a fork's pull request, whose token cannot write releases.
      - name: Publish the store cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/nix-cache.sh push "${{ steps.nix.outputs.cache-key }}"

      # Saving an empty cache would be worse than saving none: actions/cache
      # refuses to overwrite a key, so the stub would stick until the tree
      # changed, and every job would restore it, skip the release fallback,
      # and rebuild angr from source.
      - id: worth-saving
        if: always()
        run: |
          if compgen -G '.nix-cache/*.narinfo' > /dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v6
        if: always() && steps.worth-saving.outputs.ok == '1'
        with:
          path: |
            .nix-cache
            ~/.cache/nix
          key: nix-store-${{ steps.nix.outputs.cache-key }}

  checks:
    name: Flake checks
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}
      # Two steps, because they answer different questions: whether every
      # output evaluates on every system this flake offers it for, and whether
      # this system's checks pass. See ci/check-eval.sh for why the obvious
      # `nix flake check --all-systems` is neither.
      - run: ci/check-eval.sh
      - run: nix flake check --print-build-logs

  test:
    name: ${{ matrix.label }}
    needs: [plan, warm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
        with:
          token: ${{ github.token }}

      - name: Run ${{ matrix.label }}
        env:
          SUITES: ${{ matrix.suites }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: ci/run-job.sh "$SUITES" --shard "$SHARD" --of "$SHARDS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          path: test-results/*.xml
          # A pytest that dies during collection writes no XML. With `ignore`
          # the lane contributes no row to the summary table and nothing
          # anywhere says a suite went missing.
          if-no-files-found: error

  # The second lane. Nix does not run on Windows, and upstream gates on
  # Windows, macOS and Python versions past 3.12 -- so those get the same
  # suites through uv, against the same component sources and, because both
  # lanes read flake.lock, the same external commits.
  native:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      # angr's rustylib and pyvex's libvex are compiled here, not substituted.
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Qt and X11 for angr-management
        if: runner.os == 'Linux' && contains(matrix.suites, 'angr-management')
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
      - name: Keystone and flatbuffers for angr-management
        if: runner.os == 'macOS' && contains(matrix.suites, 'angr-management')
        run: brew install flatcc flatbuffers keystone

      - name: Install the workspace
        run: python ci/run-native.py --install --python ${{ matrix.python }}

      - name: Run ${{ matrix.label }}
        if: matrix.suites != ''
        env:
          SUITES: ${{ matrix.suites }}
        # Word splitting is the point: SUITES is a space-separated list.
        run: |
          # shellcheck disable=SC2086
          python ci/run-native.py $SUITES

      # Upstream's `installation` job, verbatim in effect: collect the suite
      # without running it. That imports every test module and every symbol
      # they pull out of angr, which is what catches a refactor that does not
      # survive the platform. Running the suite itself is the Nix lane's job.
      - name: Collect ${{ matrix.collect }}
        if: matrix.collect != ''
        env:
          COLLECT: ${{ matrix.collect }}
        run: |
          # shellcheck disable=SC2086
          python ci/run-native.py $COLLECT --collect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          path: test-results/*.xml
          # A pytest that dies during collection writes no XML. With `ignore`
          # the lane contributes no row to the summary table and nothing
          # anywhere says a suite went missing.
          if-no-files-found: error

  # angr's Rust extension. The Nix lane compiles it; nothing there runs its
  # tests or looks at it the way upstream's rust_check/rust_test jobs do.
  rust:
    name: rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # angr/rust-toolchain.toml pins the toolchain, so rustup switches to it
      # inside angr/ and the components have to be added there rather than to
      # whatever the action installed as stable.
      - run: rustup component add rustfmt clippy
        working-directory: angr
      - run: cargo fmt --all -- --check
        working-directory: angr
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: angr
        if: runner.os == 'Linux'
      - run: cargo test --release
        working-directory: angr

  # The two ratchets upstream gates on. Neither demands a clean score; both
  # demand that a file you touched did not get worse. See the scripts.
  ratchets:
    name: Lint and typecheck ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the workspace
        run: python ci/run-native.py --install --python 3.12
      # A uv-created venv has no pip in it, so uv installs into it too.
      - run: uv pip install --python .venv-native/bin/python "pylint>=2.14.0" pyright
      - name: pylint score ratchet
        run: .venv-native/bin/python ci/lint.py --base origin/${{ github.base_ref || 'main' }}
      - name: pyright badness ratchet
        run: |
          PATH="$PWD/.venv-native/bin:$PATH" .venv-native/bin/python ci/typecheck.py \
            --base origin/${{ github.base_ref || 'main' }}

  # Every component ships a .pre-commit-config.yaml, three of the commits
  # this tree imported are literally "[pre-commit.ci] pre-commit autoupdate",
  # and nothing here ran any of it. It is the ecosystem's only gate on
  # formatting, import order, modernisation, RST, symlinks and stray large
  # files -- pylint checks none of that. One job per component, because the
  # configs differ and a component's hooks are its own.
  pre-commit:
    name: pre-commit · ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - angr
          - angr-management
          - archinfo
          - claripy
          - cle
          - pypcode
          - pyvex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install pre-commit
      - name: Run ${{ matrix.component }}'s own hooks
        run: ci/pre-commit.sh ${{ matrix.component }}

  # pypcode is the one component upstream keeps out of the ecosystem sweep:
  # it ships wheels across five platforms and tests them with unittest, not
  # pytest. This is that job, for the platforms actions can reach.
  wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From an unpacked sdist, as upstream does, not from the tree.
      #
      # Two reasons, and the second one bit. It proves the sdist is complete
      # -- the thing a tree build can never tell you. And cibuildwheel reuses
      # one CMake build directory across Python versions, so a tree build
      # leaves cp312's CMakeCache behind and cp313 configures against the
      # wrong interpreter and dies.
      - name: Build the sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist pypcode
      - name: Unpack it
        # bash, because the default shell on the Windows runner is PowerShell
        # and PowerShell does not expand a glob for an external command:
        # tar.exe is handed the literal `dist/*.tar.gz` and cannot open it.
        shell: bash
        run: |
          mkdir sdist
          tar --strip-components 1 -xf dist/*.tar.gz -C sdist

      - uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: sdist
        env:
          CIBW_BUILD: cp312-* cp313-* cp314-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*musllinux*"
          # As upstream pypcode sets it, per architecture. Without it,
          # delocate refuses the x86_64 wheel -- `Library dependencies do not
          # satisfy target MacOS version 10.13` -- because the SDK's default
          # is older than what the C++ the SLEIGH decompiler needs was built
          # against. Ignored off macOS.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-15' && '11' || '10.14' }}
          CIBW_TEST_COMMAND: python -m unittest discover -v -s {package}/tests
          CIBW_BUILD_VERBOSITY: 1
          # cibuildwheel keeps one build directory per package and reuses it
          # for every Python, so cp312's CMakeCache is still sitting there
          # when cp313 configures: cmake reports `found version "3.12.13"`
          # and fails on the include dirs that go with an interpreter it is
          # not building for. Unpacking the sdist did not fix this -- the
          # sdist is unpacked once and built from three times.
          CIBW_BEFORE_BUILD: >-
            python -c "import shutil, sys;
            shutil.rmtree(sys.argv[1] + '/build', ignore_errors=True)"
            {package}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pypcode-${{ matrix.os }}
          path: wheelhouse/*.whl

  # angr-management's frozen app. Upstream calls pyinstaller-build.yml from
  # its own ci.yml, so this gates on every pull request there: it catches an
  # import PyInstaller's analysis cannot see, a resource missing from the
  # spec's datas, an unbundled Qt platform plugin -- none of which the test
  # suite can observe, because the suite runs in a venv where everything is
  # importable by construction.
  pyinstaller:
    name: pyinstaller · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Qt and X11
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 xvfb x11-utils
      - name: Keystone and flatbuffers
        if: runner.os == 'macOS'
        run: brew install flatcc flatbuffers keystone
      - run: python ci/run-native.py --install --python 3.12
      # angr-management's spec imports keystone; upstream gets it from the
      # pyinstaller dependency group that `uv sync` installs.
      - run: |
          uv pip install --python .venv-native/bin/python \
            "pyinstaller~=6.19" keystone-engine
      # ci/import.py drops these two submodules -- 195 MB of FLIRT
      # signatures and 7 MB of library docs, runtime data rather than code
      # under test -- but the spec names both in its `datas` and PyInstaller
      # refuses a path that is not there. Upstream gets them from
      # `submodules: recursive` on its checkout; cloning them at freeze time
      # keeps the bundle equal to upstream's without the tree carrying 200 MB.
      - name: Resource submodules
        working-directory: angr-management/angrmanagement/resources
        run: |
          git clone --depth 1 https://github.com/angr/flirt_signatures
          git clone --depth 1 https://github.com/angr/library_docs
      - name: Freeze
        working-directory: angr-management
        run: ../.venv-native/bin/pyinstaller angr-management.spec
      # Upstream's test_ubuntu: start the thing and look for its window.
      - name: Start it
        if: runner.os == 'Linux'
        working-directory: angr-management
        run: |
          xvfb-run bash -c '
            ./dist/angr-management/angr-management &
            sleep 45
            xwininfo -tree -root | grep -i "angr management"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: angr-management-${{ matrix.os }}
          path: angr-management/dist
          if-no-files-found: error

  # pyvex gates on a Pyodide build upstream, and cle is pinned here at the
  # commit titled "Test CLE under Pyodide (#704)" -- the emscripten markers in
  # its pyproject and the sys.platform guards in its tests are otherwise dead
  # weight in this tree.
  #
  # Only pyvex for now. cle's pyodide job runs its suite inside a
  # `uv sync --python pyodide@3.14` environment against the pyvex wheel built
  # here, which is a second thing to get right and is not done yet.
  pyodide:
    name: pyodide · pyvex
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the pinned VEX sources
        run: python ci/fetch-external.py vex
      - uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: pyvex
        env:
          CIBW_PLATFORM: pyodide
          CIBW_PYODIDE_VERSION: "314.0.0"
          # pyvex's own config says `pytest {project}/tests`, and {project} is
          # the repository root -- which upstream is pyvex and here is not.
          CIBW_TEST_COMMAND: pytest {package}/tests
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-pyvex
          path: wheelhouse/*.whl
          if-no-files-found: ignore

  # Sphinx. Every component reports a readthedocs status on its pull
  # requests, and pypcode builds its docs inside Actions on top of that.
  # autodoc imports the package to document it, so this also catches a
  # docstring that crashes sphinx-autodoc-typehints and a broken
  # cross-reference -- neither of which any test suite touches.
  docs:
    name: docs · ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [angr, angr-management, archinfo, claripy, cle, pypcode, pyvex]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Qt for angr-management's autodoc
        if: matrix.component == 'angr-management'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
      - run: python ci/run-native.py --install --python 3.12
      - name: Documentation tooling
        run: |
          uv pip install --python .venv-native/bin/python \
            furo myst-parser sphinx sphinx-autodoc-typehints ipython
      - name: Build ${{ matrix.component }}'s docs
        working-directory: ${{ matrix.component }}/docs
        env:
          QT_QPA_PLATFORM: offscreen
        run: ../../.venv-native/bin/python -m sphinx -b html . _build/html

  summary:
    name: Summary
    needs: [test, native, rust, ratchets, wheels, checks, pre-commit, pyinstaller, pyodide, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: results-*
          merge-multiple: true
      - run: ci/summarize.py test-results >> "$GITHUB_STEP_SUMMARY"
      # `needs.*` over the whole dependency list rather than a hand-written
      # enumeration: the enumeration named six of the ten lanes, so
      # pre-commit, pyinstaller, pyodide and docs could each go red with this
      # job green. A gate you have to remember to extend is a gate that
      # eventually lies about a lane nobody is looking at.
      - name: Fail if any lane failed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: exit 1
